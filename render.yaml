services:
  - type: web
    name: gdg-mcet-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    disk:
      name: gdg-mcet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GDG_DB_PATH
        value: /var/data/gdg_tracker.db
      - key: GDG_ADMIN_PASSWORD
        sync: false
